name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: "Run the full matrix (macOS, Windows, fuzz smoke)"
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # Pull requests run the fast Linux-only tier; the full cross-platform
  # matrix and the fuzz smoke test run once per merge to main. Use the
  # workflow_dispatch button to force a full run on a branch.
  lint-and-test:
    uses: ./.github/workflows/lint-and-test.yml
    with:
      full: ${{ github.event_name == 'push' || inputs.full || false }}

  msrv:
    name: MSRV check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install cmake
        run: sudo apt-get update && sudo apt-get install -y cmake
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93"
      # --workspace, or this only checks the root `lore` package and lore-cli's
      # MSRV compliance is never verified.
      - run: cargo check --workspace --all-features

  deny:
    name: Cargo deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
      # fuzz/ declares its own [workspace] and therefore its own Cargo.lock,
      # which the step above does not see: it resolves the root lockfile only.
      # Without this the fuzz lockfile rots unaudited (it accumulated 7
      # advisories over four months before anyone looked).
      #
      # advisories only: the harness legitimately fails `licenses` (libfuzzer-sys
      # is NCSA) and `bans` (its path dependency on the parent crate reads as a
      # wildcard). Neither is a supply-chain signal worth gating on.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: fuzz/Cargo.toml
          command: check
          command-arguments: advisories
