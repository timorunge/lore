name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: "Run the full matrix (macOS, Windows, fuzz smoke)"
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # Pull requests run the fast Linux-only tier; the full cross-platform
  # matrix and the fuzz smoke test run once per merge to main. Use the
  # workflow_dispatch button to force a full run on a branch.
  lint-and-test:
    uses: ./.github/workflows/lint-and-test.yml
    with:
      full: ${{ github.event_name == 'push' || inputs.full || false }}

  msrv:
    name: MSRV check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install cmake
        run: sudo apt-get update && sudo apt-get install -y cmake
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93"
      - run: cargo check --all-features

  deny:
    name: Cargo deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
