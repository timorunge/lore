name: sitemap
description: >-
  Public documentation fetched via XML sitemap. Discovers pages
  automatically and indexes their content.

sources:
  # htmx documentation -- small, public, well-structured
  - sitemap: https://htmx.org/sitemap.xml
    include: "/docs/"
    topic: htmx

store:
  path: ./store

fetch:
  delay: 1.0
  concurrency: 2
  respect_robots: true
