[graph]
all-features = true

[advisories]
ignore = [
    # paste: unmaintained but widely used, transitive dep -- no alternative yet
    "RUSTSEC-2024-0436",
    # unsafe-libyaml: unmaintained, pulled in by serde_yaml_ng (our mandated YAML
    # crate). Revisit when switching to a safe-Rust YAML parser.
    "RUSTSEC-2024-0449",
    # zip 8: SUID bits / symlinks in ZipArchive::extract and ZipStreamReader::extract.
    # lore never calls extract() -- archive.rs copies entry bytes into regular files
    # and applies no Unix modes. zip 8 stays because calamine (via kreuzberg) needs
    # it, and zip 9 breaks the kreuzberg-tesseract 4.10.4 build script (`zip >=7`).
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "OpenSSL",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
    "Elastic-2.0",
    "bzip2-1.0.6",
    "CDLA-Permissive-2.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
